# ansible.cfg
# Ansible configuration for AWS disk monitoring deployment

[defaults]
# Inventory
inventory = inventory/aws_ec2.yml

# Roles path
roles_path = roles

# Performance
forks = 20
timeout = 30
poll_interval = 5

# Output
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks
display_skipped_hosts = false
display_ok_hosts = true

# SSH settings
host_key_checking = false
remote_tmp = /tmp/.ansible-${USER}/tmp

# Retry files
retry_files_enabled = true
retry_files_save_path = /tmp/ansible-retries

# Logging
log_path = /var/log/ansible/disk-monitoring.log

# Fact caching (speeds up subsequent runs)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Collections
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections

[inventory]
# Enable the aws_ec2 plugin
enable_plugins = amazon.aws.aws_ec2, auto, host_list, yaml, ini

# Cache inventory results
cache = true
cache_plugin = jsonfile
cache_timeout = 300
cache_connection = /tmp/ansible_inventory_cache

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false

[ssh_connection]
# Pipelining improves performance by reducing SSH operations
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Retries for transient connection failures
retries = 3

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[colors]
changed = yellow
ok = green
error = red
warn = purple
